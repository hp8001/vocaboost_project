# Đồng bộ bảng xếp hạng VocaBoost (QĐ3). Ứng dụng không ghi leaderboard; job này tính và ghi.
# Cần secret FIREBASE_SERVICE_ACCOUNT_JSON (service account riêng, vai trò Cloud Datastore User).
name: leaderboard-sync

on:
  schedule:
    - cron: '*/30 * * * *'   # mỗi 30 phút (giờ UTC; GitHub có thể trễ vài phút)
  workflow_dispatch:          # cho phép bấm chạy tay ở tab Actions

permissions:
  contents: read

concurrency:
  group: leaderboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài firebase-admin
        run: pip install firebase-admin
      - name: Kiểm thử logic
        run: python tools/leaderboard_sync.py --self-test
      - name: Đồng bộ leaderboard
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/leaderboard_sync.py
